
services:
  postgres:
    command: ["postgres", "-c", "log_statement=all", "-c", "log_destination=stderr"]
    image: postgres:latest
    platform: linux/arm64
    container_name: dataflow-api
    environment:
      POSTGRES_USER: datauser
      POSTGRES_PASSWORD: supersecret
      POSTGRES_DB: dataflow
    ports:
      - "5234:5432"
    volumes:
      - ./src/database/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./src/database/extensions.sql:/docker-entrypoint-initdb.d/2_extensions.sql
      - ./src/database/staticData.sql:/docker-entrypoint-initdb.d/3_staticData.sql
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
